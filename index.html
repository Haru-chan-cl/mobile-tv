<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Política de seguridad: todo es propio, salvo los marcos del reproductor de YouTube. Sin scripts ni estilos en línea.
       Lo que YouTube necesite dentro de su marco lo gobierna YouTube, no esta página. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <!-- Los navegadores solo respetan X-Content-Type-Options como cabecera HTTP; aquí queda como declaración. -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Canales</title>
  <meta name="theme-color" content="#18000c">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="card">
    <div class="stripes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <header class="topbar">
      <h1>Canales</h1>
    </header>
    <main>
      <p id="aviso-sin-conexion" class="notice" role="status" hidden>
        Sin conexión: la lista se ve, pero los videos y los sitios oficiales necesitan internet.
      </p>
      <div class="panels">
        <section id="panel-inicio" class="panel" role="tabpanel" aria-labelledby="tab-inicio" hidden>
          <h2>Inicio</h2>
          <p class="message">Próximamente</p>
        </section>

        <section id="panel-en-vivo" class="panel live" role="tabpanel" aria-labelledby="tab-en-vivo">
          <section id="reproductor" class="player-area" aria-labelledby="reproductor-titulo">
            <h2 id="reproductor-titulo" class="sr-only">Reproductor</h2>
            <div id="reproductor-contenido" aria-live="polite">
              <div class="player-frame player-empty">
                <p class="message">Elige un canal de YouTube para verlo aquí.</p>
              </div>
            </div>
          </section>
          <section id="en-vivo" class="channel-area" aria-labelledby="en-vivo-titulo">
            <h2 id="en-vivo-titulo" class="sr-only">Canales en vivo</h2>
            <div id="lista-canales" aria-live="polite">
              <p class="message">Cargando canales...</p>
            </div>
          </section>
        </section>

        <section id="panel-vod" class="panel" role="tabpanel" aria-labelledby="tab-vod" hidden>
          <h2>VOD</h2>
          <p class="message">Próximamente</p>
        </section>

        <section id="panel-perfil" class="panel" role="tabpanel" aria-labelledby="tab-perfil" hidden>
          <h2>Perfil</h2>
          <p class="message">Próximamente</p>
        </section>
      </div>
    </main>
    <nav class="tabbar" aria-label="Navegación principal">
      <div id="barra-pestanas" class="tabs" role="tablist" aria-label="Secciones de la app">
        <button type="button" id="tab-inicio" class="tab" role="tab" data-tab="inicio" aria-controls="panel-inicio" aria-selected="false" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11 12 3l9 8M5 10v11h14V10"/></svg>
          <span>Inicio</span>
        </button>
        <button type="button" id="tab-en-vivo" class="tab" role="tab" data-tab="en-vivo" aria-controls="panel-en-vivo" aria-selected="true" tabindex="0">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 2l4 5 4-5"/><rect x="3" y="7" width="18" height="13"/></svg>
          <span>En Vivo</span>
        </button>
        <button type="button" id="tab-vod" class="tab" role="tab" data-tab="vod" aria-controls="panel-vod" aria-selected="false" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16"/><path d="M10 9l5 3-5 3z"/></svg>
          <span>VOD</span>
        </button>
        <button type="button" id="tab-perfil" class="tab" role="tab" data-tab="perfil" aria-controls="panel-perfil" aria-selected="false" tabindex="-1">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21v-3h16v3"/></svg>
          <span>Perfil</span>
        </button>
      </div>
    </nav>
  </div>
  <script type="module" src="js/app.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
