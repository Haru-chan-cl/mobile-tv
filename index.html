<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canales</title>
  <meta name="theme-color" content="#18000c">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="card">
    <div class="stripes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <header>
      <h1>Canales</h1>
      <p>Señales oficiales de televisión, noticias y ciencia.</p>
    </header>
    <main>
      <p id="aviso-sin-conexion" class="notice" role="status" hidden>
        Sin conexión: la lista se ve, pero los videos y los sitios oficiales necesitan internet.
      </p>
      <div class="layout">
        <section id="en-vivo" aria-labelledby="en-vivo-titulo">
          <h2 id="en-vivo-titulo">En vivo</h2>
          <div id="lista-canales" aria-live="polite">
            <p class="message">Cargando canales...</p>
          </div>
        </section>
        <section id="reproductor" aria-labelledby="reproductor-titulo">
          <h2 id="reproductor-titulo">Reproductor</h2>
          <div id="reproductor-contenido" aria-live="polite">
            <p class="message">Elige un canal de YouTube para verlo aquí.</p>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
